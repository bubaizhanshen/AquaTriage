[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoood"
version = "0.3.0"
description = "AquaTriage review prioritization for aquatic ecotoxicity screening."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "joblib>=1.4",
  "beautifulsoup4>=4.12",
  "lightgbm>=4.0",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "rdkit==2024.3.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
[project.urls]
Homepage = "https://github.com/bubaizhanshen/EcoOOD"
Repository = "https://github.com/bubaizhanshen/EcoOOD"
Issues = "https://github.com/bubaizhanshen/EcoOOD/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
