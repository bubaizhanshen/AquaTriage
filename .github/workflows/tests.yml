name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src scripts tests

  hosted-app:
    runs-on: ubuntu-latest
    container: python:3.11-slim-bookworm
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      TMPDIR: ${{ github.workspace }}/tmp/ci
      TMP: ${{ github.workspace }}/tmp/ci
      TEMP: ${{ github.workspace }}/tmp/ci
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime directory
        run: mkdir -p tmp/ci
      - name: Install declared system dependencies
        run: |
          apt-get update
          xargs -r apt-get install -y --no-install-recommends < packages.txt
      - name: Install hosted environment
        run: python -m pip install -r app/requirements.txt pytest
      - name: Test application and reference
        run: python -m pytest tests/test_review_workflow.py tests/test_review_cloud.py -q
